<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เกม 5W1H Hand Tracking</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #eef4ff, #fff8e8);
  color: #222;
  text-align: center;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

h1 {
  color: #315dcc;
  margin-bottom: 5px;
}

.subtitle {
  color: #666;
  margin-bottom: 20px;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 20px;
  margin: 15px 0;
  box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

#cameraBox {
  position: relative;
  max-width: 640px;
  margin: auto;
  border-radius: 18px;
  overflow: hidden;
  background: #111;
}

video {
  width: 100%;
  display: block;
  transform: scaleX(-1);
}

#handStatus {
  font-size: 22px;
  font-weight: bold;
  margin: 15px;
  min-height: 30px;
}

.question {
  font-size: 24px;
  font-weight: bold;
  margin: 20px 0;
}

.choices {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.choice {
  border: none;
  border-radius: 15px;
  padding: 18px;
  font-size: 18px;
  cursor: pointer;
  background: #f1f4fa;
}

.choice:hover {
  background: #dfe8ff;
}

.choice span {
  font-weight: bold;
  color: #315dcc;
  font-size: 22px;
}

button.main {
  border: none;
  border-radius: 14px;
  padding: 14px 25px;
  background: #315dcc;
  color: white;
  font-size: 18px;
  cursor: pointer;
}

#score {
  font-size: 22px;
  font-weight: bold;
}

#result {
  font-size: 22px;
  font-weight: bold;
  min-height: 30px;
}

.hidden {
  display: none;
}

.instruction {
  background: #fff7d6;
  padding: 15px;
  border-radius: 15px;
  margin: 15px 0;
  line-height: 1.7;
}
</style>
</head>

<body>

<div class="container">

  <h1>เกม 5W1H</h1>
  <div class="subtitle">เรียนรู้การคิดวิเคราะห์ด้วย Hand Tracking</div>

  <div class="card">

    <div class="instruction">
      <b>วิธีเล่น</b><br>
      ชูนิ้วเพื่อเลือกคำตอบ<br>
      ☝️ 1 นิ้ว = A &nbsp;&nbsp;
      2 นิ้ว = B &nbsp;&nbsp;
      3 นิ้ว = C &nbsp;&nbsp;
      4 นิ้ว = D
    </div>

    <button class="main" id="startBtn">
      เริ่มเกมและเปิดกล้อง
    </button>

    <div id="cameraBox" class="hidden">
      <video id="video" autoplay playsinline></video>
    </div>

    <div id="handStatus">
      ยังไม่ได้เปิดกล้อง
    </div>

  </div>

  <div class="card">

    <div id="score">
      คะแนน: 0 / 5
    </div>

    <div id="questionNumber">
      ข้อที่ 1
    </div>

    <div class="question" id="question">
      กด "เริ่มเกมและเปิดกล้อง"
    </div>

    <div class="choices">

      <button class="choice" onclick="answer(0)">
        <span>A</span><br>
        <span id="a"></span>
      </button>

      <button class="choice" onclick="answer(1)">
        <span>B</span><br>
        <span id="b"></span>
      </button>

      <button class="choice" onclick="answer(2)">
        <span>C</span><br>
        <span id="c"></span>
      </button>

      <button class="choice" onclick="answer(3)">
        <span>D</span><br>
        <span id="d"></span>
      </button>

    </div>

    <div id="result"></div>

  </div>

</div>

<script type="module">

import {
  HandLandmarker,
  FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22";

const video = document.getElementById("video");
const startBtn = document.getElementById("startBtn");
const cameraBox = document.getElementById("cameraBox");
const handStatus = document.getElementById("handStatus");

let handLandmarker;
let lastVideoTime = -1;
let cameraRunning = false;
let lastGesture = 0;
let gestureStartTime = 0;
let answeredByGesture = false;

const questions = [

  {
    q: "นักเรียนต้องการหาสาเหตุที่ทำให้ขยะในห้องเรียนเพิ่มขึ้น คำถามใดเหมาะกับ What?",
    choices: [
      "เกิดปัญหาอะไรขึ้น",
      "ใครเป็นคนทิ้งขยะ",
      "เกิดขึ้นที่ไหน",
      "เกิดขึ้นเมื่อไร"
    ],
    answer: 0
  },

  {
    q: "ถ้าต้องการรู้ว่าใครเกี่ยวข้องกับปัญหา ควรถามคำถามใด?",
    choices: [
      "Where",
      "Who",
      "When",
      "Why"
    ],
    answer: 1
  },

  {
    q: "คำถามว่า 'ปัญหานี้เกิดขึ้นที่ไหน?' ตรงกับข้อใด?",
    choices: [
      "Who",
      "Why",
      "Where",
      "What"
    ],
    answer: 2
  },

  {
    q: "คำถามว่า 'ทำไมปัญหานี้จึงเกิดขึ้น?' ตรงกับข้อใด?",
    choices: [
      "When",
      "Where",
      "Who",
      "Why"
    ],
    answer: 3
  },

  {
    q: "ถ้าต้องการรู้ว่าเหตุการณ์เกิดขึ้นเวลาใด ควรถามข้อใด?",
    choices: [
      "When",
      "Who",
      "What",
      "Where"
    ],
    answer: 0
  }

];

let currentQuestion = 0;
let score = 0;
let waiting = false;

function showQuestion() {

  if (currentQuestion >= questions.length) {
    document.getElementById("question").textContent =
      "จบเกมแล้ว!";

    document.getElementById("questionNumber").textContent =
      "สรุปผล";

    document.getElementById("score").textContent =
      `คะแนน: ${score} / ${questions.length}`;

    document.querySelector(".choices").style.display = "none";

    document.getElementById("result").textContent =
      score >= 4
        ? "ยอดเยี่ยมมาก!"
        : score >= 3
        ? "ทำได้ดีมาก!"
        : "ลองเล่นอีกครั้งเพื่อพัฒนาคะแนน";

    return;
  }

  const q = questions[currentQuestion];

  document.getElementById("questionNumber").textContent =
    `ข้อที่ ${currentQuestion + 1} / ${questions.length}`;

  document.getElementById("question").textContent = q.q;

  document.getElementById("a").textContent = q.choices[0];
  document.getElementById("b").textContent = q.choices[1];
  document.getElementById("c").textContent = q.choices[2];
  document.getElementById("d").textContent = q.choices[3];

  document.getElementById("score").textContent =
    `คะแนน: ${score} / ${questions.length}`;

  document.getElementById("result").textContent = "";

  waiting = false;
  answeredByGesture = false;
  lastGesture = 0;
}

window.answer = function(choice) {

  if (waiting || currentQuestion >= questions.length) return;

  waiting = true;

  const correct = questions[currentQuestion].answer;

  if (choice === correct) {
    score++;
    document.getElementById("result").textContent = "ถูกต้อง!";
  } else {
    document.getElementById("result").textContent = "ยังไม่ถูก ลองข้อถัดไป";
  }

  document.getElementById("score").textContent =
    `คะแนน: ${score} / ${questions.length}`;

  setTimeout(() => {
    currentQuestion++;
    showQuestion();
  }, 1200);
};


async function setupHandTracking() {

  handStatus.textContent = "กำลังโหลดระบบตรวจจับมือ...";

  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
  );

  handLandmarker = await HandLandmarker.createFromOptions(
    vision,
    {
      baseOptions: {
        modelAssetPath:
          "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
      },

      runningMode: "VIDEO",

      numHands: 1
    }
  );

  handStatus.textContent =
    "พร้อมแล้ว! ชูนิ้ว 1–4 เพื่อเลือกคำตอบ";

  detectHands();
}


async function detectHands() {

  if (!cameraRunning) return;

  if (video.currentTime !== lastVideoTime) {

    lastVideoTime = video.currentTime;

    const results =
      handLandmarker.detectForVideo(
        video,
        performance.now()
      );

    if (
      results.landmarks &&
      results.landmarks.length > 0
    ) {

      const landmarks = results.landmarks[0];

      const fingers = countFingers(landmarks);

      if (fingers >= 1 && fingers <= 4) {

        handStatus.textContent =
          `ตรวจพบ ${fingers} นิ้ว → ${["A","B","C","D"][fingers-1]}`;

        processGesture(fingers);

      } else {

        handStatus.textContent =
          "กรุณาชูนิ้ว 1–4 นิ้ว";

        lastGesture = 0;
      }

    } else {

      handStatus.textContent =
        "ยังไม่พบมือ ลองยกมือให้อยู่หน้ากล้อง";

      lastGesture = 0;
    }
  }

  requestAnimationFrame(detectHands);
}


function countFingers(lm) {

  let count = 0;

  // Index
  if (lm[8].y < lm[6].y) count++;

  // Middle
  if (lm[12].y < lm[10].y) count++;

  // Ring
  if (lm[16].y < lm[14].y) count++;

  // Pinky
  if (lm[20].y < lm[18].y) count++;

  return count;
}


function processGesture(fingers) {

  if (waiting || answeredByGesture) return;

  const now = performance.now();

  if (fingers !== lastGesture) {

    lastGesture = fingers;
    gestureStartTime = now;

    return;
  }

  // ต้องถือท่าเดิมประมาณ 0.8 วินาที
  if (now - gestureStartTime > 800) {

    answeredByGesture = true;

    answer(fingers - 1);
  }
}


startBtn.addEventListener("click", async () => {

  try {

    startBtn.disabled = true;
    startBtn.textContent = "กำลังเปิดกล้อง...";

    const stream =
      await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "user",
          width: 640,
          height: 480
        },
        audio: false
      });

    video.srcObject = stream;

    cameraBox.classList.remove("hidden");

    cameraRunning = true;

    showQuestion();

    await video.play();

    await setupHandTracking();

    startBtn.textContent = "กล้องพร้อมใช้งาน";

  } catch (error) {

    console.error(error);

    handStatus.textContent =
      "ไม่สามารถเปิดกล้องได้ กรุณาอนุญาตการใช้กล้อง";
    
    startBtn.disabled = false;
    startBtn.textContent = "ลองเปิดกล้องอีกครั้ง";
  }

});

</script>

</body>
</html>
